name: Documentation Check

on:
  pull_request:
    branches: [ main ]

jobs:
  validate-asyncapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Documentation Drift Check
        run: ./gradlew verifyAsyncApiDocs